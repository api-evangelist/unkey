apis:
  - aid: unkey:unkey-api
    name: Unkey API
    description: >-
      Unkey's REST API providing programmatic access to all platform resources: API namespace
      management, API key lifecycle (create, verify, update, reroll, delete), identity
      management, permissions and roles, standalone rate limiting with namespace overrides,
      key verification analytics via SQL, and deployment operations. All management operations
      use Bearer authentication with root keys.
    humanURL: https://www.unkey.com
    baseURL: https://api.unkey.com
