aid: unkey
name: Unkey
description: >-
  Unkey is the developer platform for modern APIs, providing globally distributed API key
  management, rate limiting, identity management, analytics, and deployment capabilities.
  The platform enables API providers to issue, verify, and revoke keys with metadata,
  expiration, usage credits, permissions, and roles — without managing any infrastructure.
url: https://raw.githubusercontent.com/api-evangelist/unkey/refs/heads/main/apis.yml
