              concurrentConnections: 10
            customerName: Acme Corp
            billing:
              tier: premium
              renewal: '2024-12-31'
        roles:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-zA-Z0-9_:\-\.\*]+$
          description: 'Assigns existing roles to this key for permission management through role-based access control.

            Roles must already exist in your workspace before assignment.

            During verification, all permissions from assigned roles are checked against requested permissions.

            Roles provide a convenient way to group permissions and apply consistent access patterns across multiple keys.

            '
          example:
          - api_admin
          - billing_reader
        permissions:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 100
          pattern: ^[a-zA-Z][a-zA-Z0-9._-]*$
          description: 'Grants specific permissions directly to this key without requiring role membership.

            Wildcard permissions like `documents.*` grant access to all sub-permissions including `documents.read` and `documents.write`.

